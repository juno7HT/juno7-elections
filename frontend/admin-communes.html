<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Communes — Juno7 Elections</title>
<style>
body{
  font-family:Arial;
  background:#f4f6f9;
  padding:40px;
}
.card{
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
  max-width:800px;
}
h2{ margin-top:0; }
input,select{
  width:100%;
  padding:10px;
  margin-top:6px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:6px;
  box-sizing:border-box;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:6px;
  cursor:pointer;
}
button:hover{ background:#1d4ed8; }
pre{
  background:#111827;
  color:#e5e7eb;
  padding:15px;
  border-radius:8px;
  overflow:auto;
  font-size:13px;
  white-space:pre-wrap;
}
.small{ color:#666; }
</style>
</head>
<body>

<div class="card">
  <h2>Admin Communes — Entrer / Mettre à jour un résultat</h2>
  <p class="small">Le sélecteur charge automatiquement les communes depuis le GeoJSON.</p>

  <label>Token admin</label>
  <input type="password" id="token" placeholder="Entre ton ADMIN_TOKEN">

  <label>Commune</label>
  <select id="communeSelect">
    <option value="">Chargement des communes…</option>
  </select>

  <label>Commune ID</label>
  <input type="text" id="communeId" readonly>

  <label>Commune nom</label>
  <input type="text" id="communeName" readonly>

  <label>Candidat</label>
  <select id="candidate">
    <option>A</option>
    <option>B</option>
    <option>C</option>
    <option>D</option>
    <option>E</option>
  </select>

  <label>Votes</label>
  <input type="number" id="votes" value="0" min="0">

  <button onclick="sendResults()">Envoyer</button>

  <h3>Réponse</h3>
  <pre id="result">—</pre>

  <h3>Dernières mises à jour</h3>
  <pre id="recentUpdates">Entre le token admin.</pre>
</div>

<script>
let communes = [];

async function loadCommunesList() {
  const res = await fetch("/geo/HTI_COMMUNES.geojson");
  const geo = await res.json();

  communes = (geo.features || []).map(ft => ({
    id: ft.properties?.shapeID || "",
    name: ft.properties?.shapeName || ""
  })).filter(x => x.id && x.name);

  communes.sort((a, b) => a.name.localeCompare(b.name, "fr"));

  const select = document.getElementById("communeSelect");
  select.innerHTML = `<option value="">Choisir une commune</option>` +
    communes.map(c => `<option value="${c.id}">${c.name}</option>`).join("");

  select.addEventListener("change", () => {
    const selected = communes.find(c => c.id === select.value);
    document.getElementById("communeId").value = selected ? selected.id : "";
    document.getElementById("communeName").value = selected ? selected.name : "";
  });
}

async function sendResults() {
  const token = document.getElementById("token").value.trim();
  const commune_id = document.getElementById("communeId").value.trim();
  const commune_name = document.getElementById("communeName").value.trim();
  const candidate = document.getElementById("candidate").value;
  const votes = parseInt(document.getElementById("votes").value, 10);
  const out = document.getElementById("result");

  try {
    const res = await fetch("/api/submit-commune-results", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-token": token
      },
      body: JSON.stringify({
        commune_id,
        commune_name,
        candidate,
        votes
      })
    });

    const data = await res.json();
    out.textContent = JSON.stringify(data, null, 2);
    loadRecentUpdates();
  } catch (err) {
    out.textContent = "Erreur réseau : " + err.message;
  }
}

async function loadRecentUpdates() {
  const token = document.getElementById("token").value.trim();
  const out = document.getElementById("recentUpdates");

  if (!token) {
    out.textContent = "Entre d'abord le token admin.";
    return;
  }

  try {
    const res = await fetch("/api/communes/recent", {
      headers: { "x-admin-token": token }
    });

    const data = await res.json();

    if (!data.ok) {
      out.textContent = JSON.stringify(data, null, 2);
      return;
    }

    if (!data.items || !data.items.length) {
      out.textContent = "Aucune mise à jour.";
      return;
    }

    out.textContent = data.items.map(row => {
      const d = new Date(row.updated_at).toLocaleString("fr-FR");
      return `${d} | ${row.commune_name} | ${row.candidate} | ${row.votes} votes`;
    }).join("\n");
  } catch (err) {
    out.textContent = "Erreur : " + err.message;
  }
}

loadCommunesList();
setInterval(loadRecentUpdates, 5000);
</script>

</body>
</html>
