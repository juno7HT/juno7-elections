<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Juno7 Elections</title>

<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
max-width:700px;
}

h2{
margin-top:0;
}

input,select{
width:100%;
padding:10px;
margin-top:6px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:6px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

pre{
background:#111827;
color:#e5e7eb;
padding:15px;
border-radius:8px;
overflow:auto;
font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<h2>Entrer / Mettre à jour un résultat</h2>

<p>Chaque envoi fait un <b>upsert</b> (mise à jour) pour le couple <b>département + candidat</b>.</p>

<label>Département</label>
<select id="dept">
<option value="HT-AR">HT-AR — Artibonite</option>
<option value="HT-CE">HT-CE — Centre</option>
<option value="HT-GA">HT-GA — Grand’Anse</option>
<option value="HT-NI">HT-NI — Nippes</option>
<option value="HT-ND">HT-ND — Nord</option>
<option value="HT-NE">HT-NE — Nord-Est</option>
<option value="HT-NO">HT-NO — Nord-Ouest</option>
<option value="HT-OU">HT-OU — Ouest</option>
<option value="HT-SD">HT-SD — Sud</option>
<option value="HT-SE">HT-SE — Sud-Est</option>
</select>

<label>Candidat</label>
<select id="candidate">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
</select>

<label>Votes</label>
<input type="number" id="votes" value="0">

<label>Token admin</label>
<input type="password" id="token">

<button onclick="sendResults()">Envoyer</button>

<h3>Réponse</h3>
<pre id="result">—</pre>

<h3>Dernières mises à jour</h3>
<pre id="recentUpdates">Chargement...</pre>

</div>

<script>

async function sendResults(){

const dept=document.getElementById("dept").value;
const candidate=document.getElementById("candidate").value;
const votes=parseInt(document.getElementById("votes").value);
const token=document.getElementById("token").value.trim();

const out=document.getElementById("result");

try{

const res=await fetch("/api/submit-results",{
method:"POST",
headers:{
"Content-Type":"application/json",
"x-admin-token":token
},
body:JSON.stringify({
dept_iso:dept,
candidate:candidate,
votes:votes
})
});

const data=await res.json();

out.textContent=JSON.stringify(data,null,2);

loadRecentUpdates();

}catch(err){

out.textContent="Erreur réseau : "+err.message;

}

}



async function loadRecentUpdates(){

const token=document.getElementById("token").value.trim();
const out=document.getElementById("recentUpdates");

if(!token){

out.textContent="Entre d'abord le token admin.";

return;

}

try{

const res=await fetch("/api/admin/recent",{
headers:{
"x-admin-token":token
}
});

const data=await res.json();

if(!data.ok){

out.textContent=JSON.stringify(data,null,2);

return;

}

if(!data.items || !data.items.length){

out.textContent="Aucune mise à jour.";

return;

}

out.textContent=data.items.map(row=>{

const d=new Date(row.updated_at).toLocaleString("fr-FR");

return `${d} | ${row.dept_iso} | ${row.candidate} | ${row.votes} votes`;

}).join("\n");

}catch(err){

out.textContent="Erreur : "+err.message;

}

}

setInterval(loadRecentUpdates,5000);

</script>

</body>
</html>
